<!doctype html>
<!--
  Link-preview ("og:image") image for flowcharter.baish.net (public/og-flowcharter.png),
  built from clockwheel's design/og-clockmaker.html: same layout (illustration
  440×440 at left 96 / top 95; name and tagline from 592 / 225).
  See HOUSE-STYLE.md §7.

  To remake it: change the <h1> / <p> or the drawing, then screenshot at exactly
  1200×630 (Playwright, after `npm ci` so the font files below exist). The fonts
  are loaded from node_modules by relative path ON PURPOSE: loading from Google
  Fonts fails silently without network access and the title falls back to a plain
  serif. Check the rendered title really is Caprasimo before using the image.
  The drawing reuses design/shapes.js, so its shapes match the app's.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Caprasimo'; font-weight: 400; src: url('../node_modules/@fontsource/caprasimo/files/caprasimo-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Figtree'; font-weight: 400; src: url('../node_modules/@fontsource/figtree/files/figtree-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Figtree'; font-weight: 600; src: url('../node_modules/@fontsource/figtree/files/figtree-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Figtree'; font-weight: 700; src: url('../node_modules/@fontsource/figtree/files/figtree-latin-700-normal.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #f5ead8; font-family: -apple-system, sans-serif; position: relative; overflow: hidden; }
  .art { position: absolute; left: 96px; top: 95px; width: 440px; height: 440px; display: block; }
  .text { position: absolute; left: 592px; top: 225px; width: 560px; }
  h1 { font-family: 'Caprasimo', serif; font-weight: 400; font-size: 72px; color: #201e1d; line-height: 1; margin-bottom: 18px; }
  p { font-family: 'Figtree', sans-serif; font-size: 27px; font-weight: 600; color: #645c50; line-height: 1.35; }
</style>
</head>
<body>
  <svg class="art" viewBox="0 0 440 440" id="art"></svg>
  <div class="text">
    <h1>Flowcharter</h1>
    <p>Create a flowchart from a list</p>
  </div>
  <script src="shapes.js"></script>
  <script>
    // A little flowchart with a loop, in a round panel like the other tools' illustrations.
    let s = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L10 5 L0 9 Z" fill="${INK}"/></marker></defs>`;
    s += `<circle cx="220" cy="220" r="220" fill="#ebddc5" stroke="rgba(32,30,29,.08)"/>`;
    const line = (pts) => `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ')}" fill="none" stroke="${INK}" stroke-width="2" marker-end="url(#arrow)"/>`;
    // lines first, so shapes sit on top of them
    s += line([[220, 80], [220, 115]]);                           // Start → Prepare
    s += line([[220, 161], [220, 196]]);                          // Prepare → Ready?
    s += line([[220, 292], [220, 350]]);                          // Ready? → End  (Yes)
    s += line([[305, 244], [344, 244], [344, 138], [295, 138]]);  // No → back to Prepare
    const text = (x, y, lines, size = 21, weight = 400) => textSvg(x, y, lines, size, weight);
    s += shapeSvg('terminator', 220, 58, 132, 44) + text(220, 58, ['Start']);
    s += shapeSvg('process', 220, 138, 150, 46) + text(220, 138, ['Prepare']);
    s += shapeSvg('decision', 220, 244, 170, 96) + text(220, 244, ['Ready?']);
    s += shapeSvg('terminator', 220, 372, 132, 44) + text(220, 372, ['End']);
    // answers written on their arrows, on a pill the colour of the panel
    const pill = (cx, cy, t) => `<rect x="${cx - 25}" y="${cy - 14}" width="50" height="28" rx="14" fill="#ebddc5"/>` + textSvg(cx, cy, [t], 18, 700);
    s += pill(220, 321, 'Yes') + pill(344, 191, 'No');
    document.getElementById('art').innerHTML = s;
  </script>
</body>
</html>
