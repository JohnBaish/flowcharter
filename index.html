<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowcharter – free flowchart maker from a simple list</title>
    <meta name="description" content="Free flowchart maker. Type your steps as a list, or answer simple questions step by step, and Flowcharter draws the chart. Print it or copy it as an image." />
    <link rel="canonical" href="https://flowcharter.baish.net/" />
    <!-- Search (SEO), 2026-10-18: <title> and the search description are
         written for search engines; the og:/twitter: tags below are for link
         previews and deliberately keep the shorter wording that's drawn into
         the preview picture. The canonical link names the one main address. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flowcharter" />
    <meta property="og:description" content="Create a flowchart from a list" />
    <meta property="og:image" content="https://flowcharter.baish.net/og-flowcharter.png" />
    <meta property="og:url" content="https://flowcharter.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flowcharter" />
    <meta name="twitter:description" content="Create a flowchart from a list" />
    <meta name="twitter:image" content="https://flowcharter.baish.net/og-flowcharter.png" />
    <!-- Dark mode: set before the page draws, so there's no flash of the wrong colours. A
         choice kept by the switch wins; otherwise the device's own setting (John, 29 October 2026).
         The same key and rule as src/lib/theme.ts. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('flowcharter-theme') } catch (e) {}
        var device = false
        try { device = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        if (t === 'dark' || (t !== 'light' && device)) document.documentElement.dataset.theme = 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
